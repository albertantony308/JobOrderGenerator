<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - The Orchestrated Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="sidebar">
        <div class="headline-md">Admin Workspace</div>
        <div>
            <div class="label-md">Navigation</div>
            <p style="margin-top: 0.5rem; font-weight: 500; color: var(--primary);">License Keys</p>
        </div>
    </div>

    <div class="main-content">
        <h1 class="headline-lg">License Management</h1>

        <div class="card">
            <h2 class="headline-md">Generate New Key</h2>
            <form id="generateForm" class="flex-row" style="flex-wrap: wrap; gap: 1rem;">
                <div class="form-group" style="flex: 1; min-width: 150px; margin-bottom: 0;">
                    <label for="keyType">License Type</label>
                    <select id="keyType" class="form-control" required>
                        <option value="Trial">Trial (30 Days)</option>
                        <option value="Lifetime">Lifetime</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1; min-width: 100px; margin-bottom: 0;">
                    <label for="maxDevices">Max Devices</label>
                    <input type="number" id="maxDevices" class="form-control" value="1" min="1" required>
                </div>
                <div class="form-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                    <label for="userEmail">Customer Email</label>
                    <input type="email" id="userEmail" class="form-control" placeholder="customer@example.com">
                </div>
                <div class="form-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                    <label for="customKey">Custom Key (Optional)</label>
                    <input type="text" id="customKey" class="form-control" placeholder="Auto-generate if empty">
                </div>
                <div class="form-group" style="display: flex; align-items: center; margin-bottom: 0; padding-top: 1.5rem;">
                    <input type="checkbox" id="cloudSync" style="margin-right: 8px;">
                    <label for="cloudSync" style="margin-bottom: 0;">Cloud Sync</label>
                </div>
                <button type="submit" class="btn-primary" style="align-self: flex-end;">Generate Key</button>
            </form>
        </div>

        <div class="card">
            <h2 class="headline-md">Active Licenses</h2>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Key / Email</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Cloud</th>
                        <th>Usage</th>
                        <th>Registered Devices</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="keysTableBody">
                    <!-- Data will be injected here via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', fetchKeys);

        document.getElementById('generateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const type = document.getElementById('keyType').value;
            const maxDevices = parseInt(document.getElementById('maxDevices').value);
            const key = document.getElementById('customKey').value;
            const email = document.getElementById('userEmail').value;
            const cloudEnabled = document.getElementById('cloudSync').checked;
            
            const payload = {
                Key: key,
                Type: type,
                TrialDays: type === 'Trial' ? 30 : 0,
                MaxDevices: maxDevices,
                Email: email,
                CloudEnabled: cloudEnabled
            };

            const res = await fetch('/api/admin/keys', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                document.getElementById('customKey').value = '';
                document.getElementById('userEmail').value = '';
                document.getElementById('cloudSync').checked = false;
                fetchKeys();
            }
        });

        async function fetchKeys() {
            const res = await fetch('/api/admin/keys');
            const keys = await res.json();
            const tbody = document.getElementById('keysTableBody');
            tbody.innerHTML = '';

            keys.forEach(k => {
                const tr = document.createElement('tr');
                
                const used = k.activations.length;
                const usageText = `${used} / ${k.maxDevices}`;
                
                let devicesHtml = k.activations.map(a => {
                    const date = new Date(a.activatedAt).toLocaleDateString();
                    return `<div style="margin-bottom: 4px;">
                        <strong>${a.deviceName || '-'}</strong>
                        <span style="font-family: monospace; font-size: 0.75rem; color: var(--on-surface-variant); margin-left: 8px;">${a.deviceId}</span>
                        <span style="font-size: 0.75rem; color: var(--on-surface-variant); margin-left: 8px;">(${date})</span>
                    </div>`;
                }).join('');

                if (used === 0) devicesHtml = '<span style="color: var(--on-surface-variant)">No devices registered</span>';
                
                tr.innerHTML = `
                    <td>
                        <div style="font-family: monospace; font-weight: 600;">${k.key}</div>
                        <div style="font-size: 0.75rem; color: var(--on-surface-variant)">${k.email || 'No email associated'}</div>
                    </td>
                    <td>${k.type}</td>
                    <td>
                        <span class="badge ${k.isActive ? 'active' : 'inactive'}">
                            ${k.isActive ? 'Active' : 'Revoked'}
                        </span>
                    </td>
                    <td>
                        <span class="badge ${k.cloudEnabled ? 'active' : 'inactive'}" style="cursor:pointer" onclick="toggleCloud(${k.id}, ${!k.cloudEnabled}, '${k.email}', ${k.isActive})">
                            ${k.cloudEnabled ? 'Enabled' : 'Disabled'}
                        </span>
                    </td>
                    <td style="font-weight: 500;">${usageText}</td>
                    <td>${devicesHtml}</td>
                    <td>
                        <button class="btn-secondary" onclick="toggleStatus(${k.id}, ${!k.isActive}, '${k.email}', ${k.cloudEnabled})">
                            ${k.isActive ? 'Revoke' : 'Activate'}
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function toggleStatus(id, newStatus, email, cloud) {
            await fetch(`/api/admin/keys/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ IsActive: newStatus, Email: email, CloudEnabled: cloud })
            });
            fetchKeys();
        }

        async function toggleCloud(id, newCloud, email, active) {
            await fetch(`/api/admin/keys/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ CloudEnabled: newCloud, Email: email, IsActive: active })
            });
            fetchKeys();
        }
    </script>
</body>
</html>
